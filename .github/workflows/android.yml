name: Build APK Dịch Truyện Trung

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Đặt tên file
        run: cp android/app/build/outputs/apk/release/app-release.apk DichTruyenTrung.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DichTruyenTrung
          path: DichTruyenTrung.apk

      - name: Đăng bản tải về
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: Dịch Truyện Trung 1.0.${{ github.run_number }}
          body: "Tải file DichTruyenTrung.apk bên dưới về điện thoại Android rồi cài."
          files: DichTruyenTrung.apk
          make_latest: true
